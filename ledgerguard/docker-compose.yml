services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ledgerguard_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard -d ledgerguard"]
      interval: 5s
      timeout: 4s
      retries: 12
    volumes:
      - ledgerguard-db:/var/lib/postgresql/data
volumes:
  ledgerguard-db:

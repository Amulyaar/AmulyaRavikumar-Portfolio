[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "1.0.0"
description = "Synthetic fintech release readiness and quality engineering simulator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["ledgerguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ledgerguard.engine"]

[tool.coverage.report]
show_missing = true
fail_under = 85

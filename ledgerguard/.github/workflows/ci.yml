name: quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerguard
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledgerguard:ledgerguard_local@localhost:5432/ledgerguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest --cov=ledgerguard.engine --cov-branch --cov-report=term-missing --cov-fail-under=85
      - run: python benchmarks/run_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerguard-benchmark-results
          path: benchmarks/results.*
